name: release
# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) → run the tests, pack the
# source and publish it as a GitHub release asset with a checksum.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack source + checksum
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist && sha256sum *.tgz > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/SHA256SUMS
          generate_release_notes: true
